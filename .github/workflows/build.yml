name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name manga_translator

      - name: Add internet permission
        run: bash scripts/setup-android.sh

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-translator-android
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project files
        run: flutter create . --platforms=windows --project-name manga_translator

      - name: Build Windows app
        run: flutter build windows --release

      - name: Zip the app
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath manga-translator-windows.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: manga-translator-windows
          path: manga-translator-windows.zip
